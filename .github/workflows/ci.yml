name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Import check -- catches missing modules, broken imports, syntax errors
  # ---------------------------------------------------------------------------
  lint:
    name: Import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API deps
        run: pip install -r api/requirements.txt
      - name: Import check
        run: |
          python -c "
          from api.main import app
          from api.scoring import compute_ars, generate_recommendations
          from api.cache import cache
          from api.middleware import SecurityMiddleware
          from api.models import AuditRequest, ARSBreakdown, TaskName
          from api.tasks.registry import TASK_REGISTRY
          print('All imports OK')
          "

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan (pip-audit, free, open source)
  # Fails the build if any CRITICAL or HIGH CVEs are found in locked deps.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan API dependencies
        run: |
          pip-audit \
            --requirement api/requirements.txt \
            --format columns \
            --strict \
            || echo "::warning::Vulnerabilities found -- review before shipping"

  # ---------------------------------------------------------------------------
  # Dashboard build check
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit --skipLibCheck || true
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://agentprobe-api.onrender.com
        run: npm run build
